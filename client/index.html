<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/school-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#344c4b" />
    <title>The Junior Cambridge School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Shown until React mounts. Must match components/splash-screen.tsx exactly. */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        background: #ffffff;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .boot-splash img { width: 132px; height: 132px; object-fit: contain; border-radius: 50%; }
      .boot-splash h1 { margin: 20px 0 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.025em; color: #344c4b; }
      .boot-splash .loc { margin: 4px 0 0; font-size: 14px; line-height: 20px; color: #5b6463; }
      .boot-splash .motto { margin: 16px 0 0; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #4f8c8d; }
      .boot-splash .track { margin-top: 40px; width: 160px; height: 3px; overflow: hidden; border-radius: 999px; background: #eaeae5; }
      .boot-splash .bar { width: 40%; height: 100%; border-radius: 999px; background: #344c4b; animation: boot-progress 1.1s ease-in-out infinite; }
      @keyframes boot-progress { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <img src="/school-logo.jpg" alt="" />
        <h1>The Junior Cambridge School</h1>
        <p class="loc">Nari, Khushab</p>
        <p class="motto">We Learn to Serve</p>
        <div class="track"><div class="bar"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
